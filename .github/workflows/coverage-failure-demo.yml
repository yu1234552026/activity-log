
name: Coverage Failure Demonstration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: failure-demo-build
          path: dist/
          if-no-files-found: error

  test-unit:
    name: Unit Tests and Coverage Gate
    needs: build
    runs-on: ubuntu-latest

    env:
      TEST_ENV: staging
      COVERAGE_THRESHOLD: "95"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Unit Tests with Coverage
        run: |
          set -o pipefail
          bun run test:coverage 2>&1 | tee coverage-report.txt

      - name: Check Coverage Threshold
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const report = fs.readFileSync(
            'coverage-report.txt',
            'utf8'
          );

          const threshold = Number(
            process.env.COVERAGE_THRESHOLD
          );

          const target = report.split('\n').find(line =>
            /^\s*#?\s*templateEngine\.js\s*\|/.test(line)
          );

          if (!target) {
            console.error('Application coverage not found');
            process.exit(1);
          }

          const coverage = Number(
            target.split('|')[1].trim()
          );

          if (!Number.isFinite(coverage)) {
            console.error('Invalid coverage value');
            process.exit(1);
          }

          console.log(
            `Application Line Coverage: ${coverage}%`
          );

          console.log(
            `Required Threshold: ${threshold}%`
          );

          if (coverage < threshold) {
            console.error(
              'Coverage gate failed. Deployment blocked.'
            );
            process.exit(1);
          }

          console.log('Coverage gate passed.');
          NODE

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-demo-coverage
          path: coverage-report.txt
          if-no-files-found: warn

  deploy-dev:
    name: Deploy to Dev (Should Be Skipped)
    needs: test-unit
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: failure-demo-build

      - name: Simulated Release
        run: |
          echo "Deployment permitted after coverage gate."
