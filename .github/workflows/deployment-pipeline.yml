
name: Assignment 4 Deployment Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build with Bun
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Package artifact
        run: zip -r build.zip dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: activity-log-build
          path: build.zip
          if-no-files-found: error

  deploy-dev:
    name: Deploy to Dev
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: activity-log-build

      - name: Verify artifact
        run: test -f build.zip

      - name: Create Dev Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUILD_TAG: ${{ vars.BUILD_TAG }}
          RELEASE_NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          set -euo pipefail
          test -n "$BUILD_TAG"
          test -n "$RELEASE_NOTE"
          TAG="${BUILD_TAG}.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" build.zip \
            --target "$GITHUB_SHA" \
            --title "Development Release $TAG" \
            --notes "$(printf '%s\n\nBuild tag: %s\n' "$RELEASE_NOTE" "$BUILD_TAG")" \
            --prerelease

  deploy-staging:
    name: Deploy to Staging
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: activity-log-build

      - name: Verify artifact
        run: test -f build.zip

      - name: Create Staging Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUILD_TAG: ${{ vars.BUILD_TAG }}
          RELEASE_NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          set -euo pipefail
          test -n "$BUILD_TAG"
          test -n "$RELEASE_NOTE"
          TAG="${BUILD_TAG}.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" build.zip \
            --target "$GITHUB_SHA" \
            --title "Staging Release $TAG" \
            --notes "$(printf '%s\n\nBuild tag: %s\n' "$RELEASE_NOTE" "$BUILD_TAG")" \
            --prerelease

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: activity-log-build

      - name: Verify artifact
        run: test -f build.zip

      - name: Create Production Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUILD_TAG: ${{ vars.BUILD_TAG }}
          RELEASE_NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          set -euo pipefail
          test -n "$BUILD_TAG"
          test -n "$RELEASE_NOTE"
          TAG="${BUILD_TAG}.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" build.zip \
            --target "$GITHUB_SHA" \
            --title "Production Release $TAG" \
            --notes "$(printf '%s\n\nBuild tag: %s\n' "$RELEASE_NOTE" "$BUILD_TAG")" \
            --latest
