
name: Assignment 4 Deployment Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix-test:
    name: Node.js ${{ matrix.node-version }} Validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate JavaScript syntax
        run: node --check src/index.js

      - name: Build verification
        run: bun run build

  build:
    name: Build with Bun
    needs: matrix-test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Read project version
        id: version
        run: |
          VERSION=$(bun -p "require('./package.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Project version: $VERSION"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Package artifact
        run: zip -r build.zip dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: activity-log-build
          path: build.zip
          if-no-files-found: error

  deploy-dev:
    name: Deploy to Dev
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: activity-log-build

      - name: Verify artifact
        run: test -f build.zip

      - name: Create Dev Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          set -euo pipefail
          test -n "$VERSION"
          test -n "$RELEASE_NOTE"
          TAG="dev-v${VERSION}.${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
            exit 1
          fi
          gh release create "$TAG" build.zip \
            --target "$GITHUB_SHA" \
            --title "Development Release $TAG" \
            --notes "$(printf '%s\n\nVersion: %s\n' "$RELEASE_NOTE" "$VERSION")" \
            --prerelease

  deploy-staging:
    name: Deploy to Staging
    needs: [build, deploy-dev]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: activity-log-build

      - name: Verify artifact
        run: test -f build.zip

      - name: Create Staging Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          set -euo pipefail
          test -n "$VERSION"
          test -n "$RELEASE_NOTE"
          TAG="staging-v${VERSION}.${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
            exit 1
          fi
          gh release create "$TAG" build.zip \
            --target "$GITHUB_SHA" \
            --title "Staging Release $TAG" \
            --notes "$(printf '%s\n\nVersion: %s\n' "$RELEASE_NOTE" "$VERSION")" \
            --prerelease

  deploy-production:
    name: Deploy to Production
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: activity-log-build

      - name: Verify artifact
        run: test -f build.zip

      - name: Create Production Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          set -euo pipefail
          test -n "$VERSION"
          test -n "$RELEASE_NOTE"
          TAG="prod-v${VERSION}.${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
            exit 1
          fi
          gh release create "$TAG" build.zip \
            --target "$GITHUB_SHA" \
            --title "Production Release $TAG" \
            --notes "$(printf '%s\n\nVersion: %s\n' "$RELEASE_NOTE" "$VERSION")" \
            --latest
